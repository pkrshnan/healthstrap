[workspace]
resolver = "3"
members = ["crates/cli", "crates/core"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/pkrshnan/healthstrap"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
